[project]
name = "tongagents-lesson1"
version = "0.2.0"
description = "Lesson 1 示例 — TongAgents SDK Agent / AgentSettings / @node_declare (本地 wheel 方式)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # TongAgents SDK 从 ../wheels/ 本地 wheel 安装 (不走 nexus, 见 INSTALL.md)
    # pip install ../wheels/tongagents-*.whl ../wheels/tongagents_cli-*.whl
    # 测试依赖
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    # 可选：读 .env
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
py-modules = ["echo_agent", "agent_settings_demo", "node_declare_demo"]
