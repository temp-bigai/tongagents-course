[project]
name = "tongagents-lesson4"
version = "0.1.0"
description = "Lesson 4 — 仿照 cli-sample 重写本地文件 CLI Agent 作业脚手架 (ReAct 循环 / 模型调用 / 工具注册与结果回填)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # tongagents SDK 从 ../wheels/ 本地 wheel 安装 (不走 nexus, 见 lesson1/INSTALL.md)
    # pip install ../wheels/tongagents-*.whl
    # dotenv (cli_file_sample.py 读 .env)
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
py-modules = ["check_homework", "cli_file_sample"]
packages = ["tools"]
