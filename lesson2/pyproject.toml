[project]
name = "tongagents-lesson2"
version = "0.2.0"
description = "Lesson 2 示例 — CoT / Self-Consistency / ToT / RAG / PromptTemplate (本地 wheel 方式)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # TongAgents SDK 从 ../wheels/ 本地 wheel 安装 (不走 nexus, 见 INSTALL.md)
    # pip install ../wheels/tongagents-*.whl ../wheels/tongagents_cli-*.whl
    # 测试依赖
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    # 可选：读 .env
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
py-modules = ["prompt_template", "cot_demo", "cot_self_consistency", "tot_demo", "rag_demo", "cot_prompt_agent"]
